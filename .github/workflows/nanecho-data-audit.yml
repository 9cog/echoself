name: NanEcho data provenance and publication guard

on:
  pull_request:
    paths:
      - 'scripts/audit_nanecho_data.py'
      - 'scripts/evaluate_dte_candidate.py'
      - 'tests/test_nanecho_data_audit.py'
      - 'tests/test_dte8192_pipeline.py'
      - 'tests/test_dte_identity_candidate_eval.py'
      - 'NanEcho/prepare_dte_grouped.py'
      - 'NanEcho/import_echo_garden.py'
      - 'tests/test_echo_garden_import.py'
      - 'NanEcho/hf_checkpoint_bridge.py'
      - 'NanEcho/evaluate_dte8192.py'
      - 'NanEcho/runtime.py'
      - 'NanEcho/spec.py'
      - 'NanEcho/dte_tokenizer/**'
      - 'data/training_sources/**'
      - 'train_cached.py'
      - 'train_nanecho.py'
      - 'training_cache.py'
      - '.github/workflows/dte8192-candidate.yml'
      - '.github/workflows/netrain-cached.yml'
      - '.github/workflows/netrain.yml'
      - '.github/workflows/agent-neuro-train.yml'
      - '.github/workflows/nanecho-data-audit.yml'
  push:
    branches: [main, master]
    paths:
      - 'scripts/audit_nanecho_data.py'
      - 'scripts/evaluate_dte_candidate.py'
      - 'tests/test_nanecho_data_audit.py'
      - 'tests/test_dte8192_pipeline.py'
      - 'tests/test_dte_identity_candidate_eval.py'
      - 'NanEcho/prepare_dte_grouped.py'
      - 'NanEcho/import_echo_garden.py'
      - 'tests/test_echo_garden_import.py'
      - 'NanEcho/hf_checkpoint_bridge.py'
      - 'NanEcho/evaluate_dte8192.py'
      - 'NanEcho/runtime.py'
      - 'NanEcho/spec.py'
      - 'NanEcho/dte_tokenizer/**'
      - 'data/training_sources/**'
      - 'train_cached.py'
      - 'train_nanecho.py'
      - 'training_cache.py'
      - '.github/workflows/dte8192-candidate.yml'
      - '.github/workflows/netrain-cached.yml'
      - '.github/workflows/netrain.yml'
      - '.github/workflows/agent-neuro-train.yml'
      - '.github/workflows/nanecho-data-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install DTE BPE runtime for offline tests
        run: python -m pip install 'tokenizers>=0.20,<0.23' 'numpy>=1.24,<3'
      - name: Test split-integrity and fail-closed behavior
        run: python -m unittest discover -s tests -p test_nanecho_data_audit.py -v
      - name: Test DTE tokenizer, source-group compiler and native HF bridge contract
        run: python -m unittest discover -s tests -p test_dte8192_pipeline.py -v
      - name: Test pinned Echo Garden import and duplicate-family rejection
        run: python -m unittest discover -s tests -p test_echo_garden_import.py -v
      - name: Check manual-only training and no legacy auto-publishing
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/netrain-cached.yml').read_text()
          assert '    - name: Audit curated training and validation data' in workflow
          assert 'python scripts/audit_nanecho_data.py' in workflow
          assert '    - name: Upload model to HuggingFace Hub' not in workflow
          assert 'python scripts/upload_to_huggingface.py' not in workflow
          for legacy in ('netrain-cached.yml', 'netrain.yml', 'agent-neuro-train.yml'):
              other = Path('.github/workflows', legacy).read_text().split('\nenv:', 1)[0]
              assert '  schedule:' not in other and '  push:' not in other and '  pull_request:' not in other
              assert '  workflow_dispatch:' in other
          print('Manual-only candidate/legacy training guard verified.')
          PY

  objective-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'numpy>=1.24,<3' 'tokenizers>=0.20,<0.23' 'tiktoken>=0.8,<1' 'huggingface_hub>=0.28,<2'
      - run: python -m unittest discover -s tests -p test_dte_identity_candidate_eval.py -v
