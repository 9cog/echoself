name: NanEcho data provenance and publication guard

on:
  pull_request:
    paths:
      - 'scripts/audit_nanecho_data.py'
      - 'tests/test_nanecho_data_audit.py'
      - 'tests/test_dte8192_pipeline.py'
      - 'NanEcho/prepare_dte_grouped.py'
      - 'NanEcho/hf_checkpoint_bridge.py'
      - 'NanEcho/spec.py'
      - 'NanEcho/dte_tokenizer/**'
      - 'data/training_sources/**'
      - 'train_cached.py'
      - 'train_nanecho.py'
      - 'training_cache.py'
      - '.github/workflows/dte8192-candidate.yml'
      - '.github/workflows/netrain-cached.yml'
      - '.github/workflows/nanecho-data-audit.yml'
  push:
    branches: [main, master]
    paths:
      - 'scripts/audit_nanecho_data.py'
      - 'tests/test_nanecho_data_audit.py'
      - 'tests/test_dte8192_pipeline.py'
      - 'NanEcho/prepare_dte_grouped.py'
      - 'NanEcho/hf_checkpoint_bridge.py'
      - 'NanEcho/spec.py'
      - 'NanEcho/dte_tokenizer/**'
      - 'data/training_sources/**'
      - 'train_cached.py'
      - 'train_nanecho.py'
      - 'training_cache.py'
      - '.github/workflows/dte8192-candidate.yml'
      - '.github/workflows/netrain-cached.yml'
      - '.github/workflows/nanecho-data-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install DTE BPE runtime for offline tests
        run: python -m pip install 'tokenizers>=0.20,<0.23' 'numpy>=1.24,<3'
      - name: Test split-integrity and fail-closed behavior
        run: python -m unittest discover -s tests -p test_nanecho_data_audit.py -v
      - name: Test DTE tokenizer, source-group compiler and native HF bridge contract
        run: python -m unittest discover -s tests -p test_dte8192_pipeline.py -v
      - name: Check workflow stays manual and non-publishing
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/netrain-cached.yml').read_text()
          assert '    - name: Audit curated training and validation data' in workflow
          assert 'python scripts/audit_nanecho_data.py' in workflow
          assert '    - name: Upload model to HuggingFace Hub' not in workflow
          assert 'python scripts/upload_to_huggingface.py' not in workflow
          head = workflow.split('\nenv:', 1)[0]
          assert '  schedule:' not in head and '  push:' not in head
          assert '  workflow_dispatch:' in head
          print('Candidate-only manual training guard verified.')
          PY
