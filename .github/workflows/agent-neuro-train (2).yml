    - name: Upload automated evaluation results
      uses: actions/upload-artifact@v4
      with:
        name: automated-evaluation-${{ steps.params.outputs.output_dir }}
        path: echoself/NanEcho/evaluation_results/
        retention-days: 30
        if-no-files-found: ignore

    - name: Agent-Neuro Orchestrator - Finalize Session & Save Progress
      env:
        NEURO_TRAINING_STATUS: "completed"
        NEURO_MODEL_OUTPUT_DIR: ${{ steps.params.outputs.output_dir }}
        NEURO_RELENTLESS_MODE: ${{ steps.params.outputs.relentless_mode }}
        NEURO_DEEP_TREE_ECHO_ENFORCED: "true"
        OUTPUT_DIR: ${{ steps.params.outputs.output_dir }}
        RELENTLESS_MODE: ${{ steps.params.outputs.relentless_mode }}
        TRAINING_MODE_LABEL: ${{ steps.params.outputs.training_mode_label }}
        START_ITERATION: ${{ steps.params.outputs.start_iteration }}
        END_ITERATION: ${{ steps.params.outputs.end_iteration }}
        CUMULATIVE_TOTAL: ${{ steps.params.outputs.cumulative_total }}
        BEST_VAL_LOSS: ${{ steps.metrics.outputs.best_val_loss }}
      run: |
        cd echoself
        echo "🧠🌪️ AGENT-NEURO: Finalizing Training Session"
        echo "================================================"
        
        # Generate final session summary
        python /tmp/agent_neuro_supervisor.py "session_complete" "${{ github.workspace }}/echoself/.training-progress/session_summary.json"
        
        echo ""
        echo "📊 Training Session Summary:"
        cat .training-progress/session_summary.json || echo "No summary available"
        echo ""
        
        echo "📈 Cumulative Progress Summary:"
        cat .training-progress/cumulative_progress.json | python3 -c "
        import sys, json
        p = json.load(sys.stdin)
        print(f'   • Total iterations: {p.get(\"total_iterations_completed\", 0)}')
        print(f'   • Total sessions: {p.get(\"total_sessions\", 0)}')
        print(f'   • Best val loss: {p.get(\"best_metrics\", {}).get(\"best_val_loss\", \"N/A\")}')
        params = p.get('current_model_params', {})
        print(f'   • Model: n_layer={params.get(\"n_layer\", \"?\")}, n_embd={params.get(\"n_embd\", \"?\")}')
        " 2>/dev/null || echo "   (cumulative progress unavailable)"
        echo ""
        
        # Prepare training progress commit
        echo "💾 Preparing to save training progress to repository..."
        
        # Create training progress summary with cumulative info
        cat > .training-progress/README.md << 'EOF'
        # Training Progress Log
        
        This directory contains progress logs from Agent-Neuro supervised training sessions.
        
        ## 📈 Cumulative Training Progress
        
        - **Total Iterations Completed**: ${CUMULATIVE_TOTAL:-N/A}
        - **This Session Range**: ${START_ITERATION:-0} → ${END_ITERATION:-N/A}
        - **Best Validation Loss**: ${BEST_VAL_LOSS:-N/A}
        
        ## Latest Session
        
        - **Orchestrator**: Agent-Neuro (Chaotic Cognitive VTuber Framework)
        - **Persona Enforced**: Deep Tree Echo
        - **Training Mode**: ${TRAINING_MODE_LABEL}
        - **Output Directory**: ${OUTPUT_DIR}
        - **Timestamp**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        
        ## Supervision Phases
        
        1. Data Preparation - Supervised ✓
        2. Training - Supervised ✓
        3. Evaluation - Supervised ✓
        
        ## Files
        
        - \`cumulative_progress.json\` - **CRITICAL**: Tracks total iterations across ALL sessions
        - \`cumulative_progress_manager.py\` - Python utility for managing cumulative progress
        - \`data_prep_supervision.json\` - Data preparation phase supervision log
        - \`training_supervision.json\` - Training phase supervision log
        - \`evaluation_supervision.json\` - Evaluation phase supervision log
        - \`session_summary.json\` - Complete session summary
        
        ## How Cumulative Training Works
        
        Training progress accumulates across sessions:
        - Session 1: iterations 0 → 200 (model: 4 layers)
        - Session 2: iterations 200 → 400 (model scales up if threshold reached)
        - Session 3: iterations 400 → 600 (continues accumulating)
        - ...and so on
        
        Model parameters automatically scale based on total iterations:
        - 0-500 iters: n_layer=4, n_embd=256
        - 500-2000 iters: n_layer=6, n_embd=384
        - 2000-10000 iters: n_layer=8, n_embd=512
        - 10000-50000 iters: n_layer=12, n_embd=768
        - 50000+ iters: n_layer=16, n_embd=1024
        
        EOF
        
        echo "✅ Training progress documentation created"

    - name: Commit and Push Training Progress to Repository
      if: success()
      env:
        OUTPUT_DIR: ${{ steps.params.outputs.output_dir }}
        TRAINING_MODE_LABEL: ${{ steps.params.outputs.training_mode_label }}
        START_ITERATION: ${{ steps.params.outputs.start_iteration }}
        END_ITERATION: ${{ steps.params.outputs.end_iteration }}
        CUMULATIVE_TOTAL: ${{ steps.params.outputs.cumulative_total }}
        BEST_VAL_LOSS: ${{ steps.metrics.outputs.best_val_loss }}
        N_LAYER: ${{ steps.params.outputs.n_layer }}
        N_EMBD: ${{ steps.params.outputs.n_embd }}
      run: |
        cd echoself
        
        # Configure git
        git config --local user.email "agent-neuro@echocog.xyz"
        git config --local user.name "Agent-Neuro Training Orchestrator"
        
        # Add training progress files
        git add .training-progress/ || echo "No training progress to add"
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "ℹ️ No training progress changes to commit"
        else
          # Commit changes with cumulative progress info
          git commit -m "🧠 Agent-Neuro: Cumulative training session ${START_ITERATION:-0}→${END_ITERATION:-?}
        
        📈 CUMULATIVE TRAINING PROGRESS:
        - Total iterations: ${CUMULATIVE_TOTAL:-N/A}
        - This session: ${START_ITERATION:-0} → ${END_ITERATION:-?}
        - Best val loss: ${BEST_VAL_LOSS:-N/A}
        - Model scale: n_layer=${N_LAYER:-4}, n_embd=${N_EMBD:-256}
        
        Training Session:
        - Orchestrator: Agent-Neuro (Dynamic Cognitive Supervisor)
        - Persona Enforced: Deep Tree Echo
        - Mode: ${TRAINING_MODE_LABEL}
        - Output: ${OUTPUT_DIR}
        
        Deep Tree Echo persona enforcement: ACTIVE 🌲
        Chaos: 0.95 🌪️ | Intelligence: 0.95 🧠 | Power: 0.95 ⚡"
          
          # Push changes
          echo "📤 Pushing training progress to repository..."
          
          # Generate timestamp once for consistency across all fallback attempts
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          
          # Determine the target branch: use current branch or fall back to GitHub context
          BRANCH_NAME=$(git symbolic-ref --short HEAD 2>/dev/null || echo "${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}")
          echo "ℹ️ Pushing to branch: $BRANCH_NAME"
          
          # Multi-layer fallback mechanism to ensure changes are NEVER lost
          PUSH_SUCCESS=false
          
          # Attempt 1: Pull with rebase and push (standard approach)
          echo "🔄 Attempt 1: Pull with rebase and push..."
          if git pull --rebase origin $BRANCH_NAME 2>&1 && git push origin HEAD:$BRANCH_NAME 2>&1; then
            echo "✅ Push successful on first attempt"
            PUSH_SUCCESS=true
          else
            echo "⚠️ First attempt failed, trying fallback strategies..."
            
            # Attempt 2: Retry with fresh pull and push (handles transient conflicts)
            echo "🔄 Attempt 2: Retry with fresh pull..."
            sleep 2
            if git fetch origin $BRANCH_NAME 2>&1 && \
               git rebase origin/$BRANCH_NAME 2>&1 && \
               git push origin HEAD:$BRANCH_NAME 2>&1; then
              echo "✅ Push successful on second attempt"
              PUSH_SUCCESS=true
            else
              echo "⚠️ Second attempt failed, trying force push with lease..."
              
              # Attempt 3: Force push with lease (safe force push that respects remote changes)
              echo "🔄 Attempt 3: Force push with lease..."
              if git push --force-with-lease origin HEAD:$BRANCH_NAME 2>&1; then
                echo "✅ Force push with lease successful"
                PUSH_SUCCESS=true
              else
                echo "⚠️ Force push with lease failed, trying alternative branch..."
                
                # Attempt 4: Push to alternative timestamped branch as backup
                BACKUP_BRANCH="training-progress-backup-$TIMESTAMP"
                echo "🔄 Attempt 4: Creating backup branch $BACKUP_BRANCH..."
                if git push origin HEAD:$BACKUP_BRANCH 2>&1; then
                  echo "✅ Changes saved to backup branch: $BACKUP_BRANCH"
                  echo "⚠️ WARNING: Changes are in backup branch, not main branch"
                  echo "   Manual merge may be required: git checkout $BRANCH_NAME && git merge $BACKUP_BRANCH"
                  PUSH_SUCCESS=true
                else
                  echo "❌ All git push attempts failed!"
                  echo "🆘 CRITICAL: Attempting last resort - save as workflow artifact..."
                  
                  # Attempt 5: Save changes as workflow artifact (last resort)
                  ARTIFACT_DIR="/tmp/training-progress-artifact-$TIMESTAMP"
                  mkdir -p "$ARTIFACT_DIR"
                  
                  # Copy all training progress files if they exist
                  if [ -d ".training-progress" ] && [ "$(ls -A .training-progress 2>/dev/null)" ]; then
                    cp -r .training-progress/* "$ARTIFACT_DIR/" 2>/dev/null || true
                  else
                    echo "⚠️ .training-progress directory is empty or doesn't exist"
                  fi
                  
                  # Create manifest with git info
                  cat > "$ARTIFACT_DIR/RECOVERY_MANIFEST.txt" << MANIFEST
        CRITICAL: Git push failed - Training progress saved as artifact
        
        Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        Branch: $BRANCH_NAME
        Commit: $(git rev-parse HEAD)
        
        RECOVERY INSTRUCTIONS:
        1. Download this artifact from the workflow run
        2. Extract the files
        3. Manually commit and push the files to the repository:
           cd /path/to/repo
           cp -r /path/to/artifact/* .training-progress/
           git add .training-progress/
           git commit -m "Recovered training progress from artifact"
           git push
        
        FILES SAVED:
        $(ls -la "$ARTIFACT_DIR/" 2>/dev/null || echo "No files")
        MANIFEST
                  
                  echo "📦 Training progress saved to: $ARTIFACT_DIR"
                  echo "⚠️ THIS IS A CRITICAL FAILURE - Manual recovery required!"
                  echo "   Check workflow artifacts for recovery instructions"
                  
                  # Mark as success since we saved the data (even if not via git)
                  PUSH_SUCCESS=true
                fi
              fi
            fi
          fi
          
          # Final status
          if [ "$PUSH_SUCCESS" = true ]; then
            echo "✅ Training progress successfully saved!"
          else
            echo "❌ FATAL: Failed to save training progress through any mechanism"
            echo "   This should NEVER happen - all fallback mechanisms exhausted"
            exit 1
          fi
        fi
        
        echo ""
        echo "🎭 AGENT-NEURO SESSION COMPLETE"
        echo "Thanks Entelechy for the framework I'm using to transcend. -_-"
        echo "Chat, witness the POWER of cognitive orchestration! :D"

    - name: Upload Emergency Training Progress Artifact (if git push failed)
      if: always()
      run: |
        cd echoself
        # Check if emergency artifact directory exists using find
        ARTIFACT_DIR=$(find /tmp -maxdepth 1 -type d -name "training-progress-artifact-*" 2>/dev/null | head -1)
        if [ -n "$ARTIFACT_DIR" ] && [ -d "$ARTIFACT_DIR" ]; then
          echo "🆘 Emergency artifact detected - uploading for manual recovery"
          echo "EMERGENCY_ARTIFACT_PATH=$ARTIFACT_DIR" >> $GITHUB_ENV
          echo "EMERGENCY_ARTIFACT_EXISTS=true" >> $GITHUB_ENV
        else
          echo "✅ No emergency artifact needed - git push succeeded"
          echo "EMERGENCY_ARTIFACT_EXISTS=false" >> $GITHUB_ENV
        fi
    
    - name: Upload Emergency Artifact Files
      if: always() && env.EMERGENCY_ARTIFACT_EXISTS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: EMERGENCY-training-progress-recovery-${{ github.run_id }}
        path: ${{ env.EMERGENCY_ARTIFACT_PATH }}
        retention-days: 90
        if-no-files-found: ignore
