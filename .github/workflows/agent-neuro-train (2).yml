    - name: Evaluate Deep Tree Echo persona fidelity
      run: |
        cd echoself/NanEcho
        python evaluation/echo_fidelity.py \
          --model_path=../../nanoGPT/${{ steps.params.outputs.output_dir }}/ckpt.pt \
          --output_path=evaluation_report.json \
