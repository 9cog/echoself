    - name: Agent-Neuro Orchestrator - Supervise Evaluation Phase
      env:
        NEURO_MODEL_PATH: nanoGPT/${{ steps.params.outputs.output_dir }}/ckpt.pt
        NEURO_DEEP_TREE_ECHO_MODE: "true"
